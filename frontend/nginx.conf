# PLEXUS frontend — serves the Vite build and reverse-proxies the backend.
#
# Path handling: proxy_pass is given WITHOUT a URI part, so the original
# request path passes through unchanged:
#   /api/auth/status -> backend:8000/api/auth/status
#   /ws/stream       -> backend:8000/ws/stream

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API — backend routes are mounted at /api/..., pass through unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket live packet/alert stream.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
